<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classified | Secret Gallery</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../static/CSS/style.css">
    
    <style>
        body {
            background-color: #0a0a0a !important;
            color: #00ff41 !important; /* Matrix Green */
            font-family: 'JetBrains Mono', monospace;
        }
        .secret-card {
            background-color: #121212;
            border: 1px solid #333;
            filter: grayscale(100%);
            transition: 0.5s;
        }
        .secret-card:hover {
            filter: grayscale(0%);
            border-color: #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
        }
        .classified-label {
            background: #ff0000;
            color: white;
            padding: 2px 10px;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body data-bs-spy="scroll" data-bs-target="#main-nav" data-bs-offset="0">
    
    <nav class="navbar navbar-expand-lg pt-4">
        <div class="container">
            <a class="navbar-brand script-font fs-2" style="color: #00ff41;" href="../templates/index.html">Rayhan</a>
            <div class="ms-auto">
                <a href="../templates/gallery.html" class="btn btn-outline-danger btn-sm rounded-pill">Back to Reality</a>
            </div>
        </div>
    </nav>

    <header class="text-center py-5 reveal">
        <div class="container">
            <div class="classified-label">Top Secret</div>
            <h1 class="display-3 typing-text">The Archives</h1>
            <p class="text-secondary">Unauthorized access will be logged. Welcome to the hidden side.</p>
            <p class="techxt-secondary">yeah i hope no one found this (hopefully)</p>
        </div>
    </header>

    <section class="container pb-5 reveal">
        <div class="d-flex flex-wrap justify-content-center gap-4">
            <!-- Secret Item 1 -->
            <div class="col-md-6 col-lg-4">
                <div class="gallery-card secret-card shadow-sm">
                    <div class="gallery-img-wrapper">
                        <img src="../static/Images/tes.jpeg" th:src="@{/Images/tes.jpeg}" alt="Classified Image">
                    </div>
                    <div class="text-center">
                        <h3 class="gallery-caption" style="color: #00ff41;">Why I Fight</h3>
                        <p class="text-muted">to protect you</p>
                    </div>
                </div>
            </div>
            
            <!-- Secret Item 2 -->
            <div class="col-md-6 col-lg-4">
                <div class="gallery-card secret-card shadow-sm">
                    <div class="gallery-img-wrapper">
                        <img src="../static/Images/anjay.jpeg " th:src="@{/Images/secret-2.jpg}" alt="Classified Image">
                    </div>
                    <div class="text-center">
                        <h3 class="gallery-caption" style="color: #00ff41;">The Reason I will fight to the end</h3>
                        <p class="text-muted small">for her</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="text-center py-4 mt-5 border-top border-secondary">
        <div class="container">
            <p class="mb-0 text-secondary">&copy; 2026 Classified Files. No Trace Left.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/JS/script.js" th:src="@{/JS/script.js}"></script>
</body>
</html>
