    <section class="container" style="padding-top: 60px;">
        <div class="row justify-content-center g-4">
            <div class="col-lg-8">
                <div class="text-center mb-5 reveal">
                    <h2 class="display-5 typing-text">Mari Berkolaborasi.</h2>
                    <p class="text-secondary mt-3">Hubungi saya melalui media sosial atau formulir di bawah ini.</p>
                </div>

                <!-- Social Links -->
                <div class="row g-3 justify-content-center mb-5 reveal">
                    <div class="col-6 col-md-3">
                        <a href="https://www.linkedin.com/in/muhammad-rayhan-hans/" target="_blank" class="d-flex align-items-center justify-content-center p-3 border rounded-4 bg-surface text-decoration-none transition-all hover-lift">
                            <i class="bi bi-linkedin fs-4 me-2" style="color: #0077b5;"></i>
                            <span class="fw-bold text-primary">LinkedIn</span>
                        </a>
                    </div>
                    <div class="col-6 col-md-3">
                        <a href="https://github.com/HannzzIDK" target="_blank" class="d-flex align-items-center justify-content-center p-3 border rounded-4 bg-surface text-decoration-none transition-all hover-lift">
                            <i class="bi bi-github fs-4 me-2" style="color: var(--text-primary);"></i>
                            <span class="fw-bold text-primary">GitHub</span>
                        </a>
                    </div>
                    <div class="col-6 col-md-3">
                        <a href="https://www.instagram.com/this.is.hannzz/" target="_blank" class="d-flex align-items-center justify-content-center p-3 border rounded-4 bg-surface text-decoration-none transition-all hover-lift">
                            <i class="bi bi-instagram fs-4 me-2" style="color: #e4405f;"></i>
                            <span class="fw-bold text-primary">Instagram</span>
                        </a>
                    </div>

                </div>

                <div id="alertPlaceholder" class="mb-4 reveal"></div>

                <form id="contactForm" class="p-4 bg-surface border rounded-4 shadow-sm reveal">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Nama Lengkap</label>
                            <input type="text" id="name" class="form-control rounded-pill p-3 border-secondary-subtle" placeholder="Masukkan nama Anda" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Alamat Email</label>
                            <input type="email" id="email" class="form-control rounded-pill p-3 border-secondary-subtle" placeholder="contoh@email.com" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">Pesan Anda</label>
                            <textarea id="message" class="form-control rounded-4 p-3 border-secondary-subtle" rows="5" placeholder="Tuliskan pesan atau pertanyaan Anda di sini..." required></textarea>
                        </div>
                        <div class="col-12 text-center mt-4">
                            <button type="submit" class="btn-custom px-5">Kirim Pesan Sekarang</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </section>
